name: Linux build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            sanitise: true
          - build_type: Release
            sanitise: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libssl-dev \
            libcurl4-openssl-dev libxtst-dev libxrandr-dev libxi-dev \
            libxinerama-dev libgtest-dev libgmock-dev qtbase5-dev libavahi-compat-libdnssd-dev
      - name: Initialise filesystem dependency
        run: git submodule update --init ext/gulrak-filesystem
      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBARRIER_BUILD_GUI=ON -DBARRIER_BUILD_INSTALLER=OFF
          -DBARRIER_BUILD_TESTS=ON -DBARRIER_USE_EXTERNAL_GTEST=ON
          -DBARRIER_BUILD_GUI_IPC_TESTS=ON
      - name: Build client, server and tests
        run: cmake --build build --target barrier barrierc barriers guiunittests guiipctests guidiscoverytests unittests integtests --parallel 2
      - name: Run unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure
      - name: Check command-line entry points
        run: |
          build/bin/barriers --version
          build/bin/barrierc --version
      - name: Build manual-only GUI without DNS-SD
        if: matrix.sanitise
        run: |
          cmake -S . -B build-manual -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBARRIER_BUILD_GUI=ON -DBARRIER_BUILD_DISCOVERY=OFF -DBARRIER_BUILD_INSTALLER=OFF -DBARRIER_BUILD_TESTS=ON -DBARRIER_USE_EXTERNAL_GTEST=ON
          cmake --build build-manual --target barrier guidiscoverytests --parallel 2
          QT_QPA_PLATFORM=offscreen ctest --test-dir build-manual -R '^gui-discovery$' --output-on-failure -V
          ldd build-manual/bin/barrier > build-manual/runtime-dependencies.txt
          if rg -q 'libdns_sd|libavahi-compat-libdns_sd' build-manual/runtime-dependencies.txt; then
            echo 'Manual-only GUI unexpectedly links DNS-SD'
            exit 1
          fi
      - name: Configure sanitised build
        if: matrix.sanitise
        run: >-
          cmake -S . -B build-sanitised -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DBARRIER_BUILD_GUI=OFF -DBARRIER_BUILD_INSTALLER=OFF
          -DBARRIER_BUILD_TESTS=ON -DBARRIER_USE_EXTERNAL_GTEST=ON
          -DBARRIER_BUILD_GUI_IPC_TESTS=ON
          -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer'
          -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined'
      - name: Check network and certificate storage with sanitisers
        if: matrix.sanitise
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake --build build-sanitised --target unittests guiipctests --parallel 2
          ctest --test-dir build-sanitised -R '^(ssl-lifecycle|certificate-storage|ipc-framing|gui-ipc)$' --output-on-failure
